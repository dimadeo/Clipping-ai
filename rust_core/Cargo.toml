[workspace]
resolver = "2"
members = [
  "crates/shared-types",
  "crates/core-logic",
  "crates/orchestration-service",
  "crates/monitoring-service",
  "crates/control-center-api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
